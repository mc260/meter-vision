<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>meter-vision</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Arial,sans-serif;background:#0f1117;color:#e0e0e0;min-height:100vh}
header{background:#1a1d27;padding:16px 32px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #2d3148}
header h1{font-size:1.4rem;font-weight:600;color:#7eb6ff}
header span{font-size:.85rem;color:#666}
.container{max-width:1200px;margin:0 auto;padding:24px}
.tabs{display:flex;gap:8px;margin-bottom:24px}
.tab{padding:8px 22px;border-radius:6px;border:1px solid #2d3148;background:transparent;color:#aaa;cursor:pointer;font-size:.9rem;transition:.2s}
.tab.active{background:#7eb6ff;color:#0f1117;border-color:#7eb6ff;font-weight:600}
.panel{display:none}.panel.active{display:block}
.card{background:#1a1d27;border:1px solid #2d3148;border-radius:12px;padding:24px;margin-bottom:20px}
.card h2{font-size:.85rem;font-weight:600;margin-bottom:16px;color:#666;letter-spacing:.07em;text-transform:uppercase}
.upload-area{border:2px dashed #2d3148;border-radius:8px;padding:40px;text-align:center;cursor:pointer;transition:.2s;position:relative}
.upload-area:hover,.upload-area.drag{border-color:#7eb6ff;background:#1e2235}
.upload-area input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.upload-area p{color:#666;font-size:.9rem;margin-top:10px}
.btn{padding:10px 24px;border-radius:6px;border:none;background:#7eb6ff;color:#0f1117;font-weight:600;cursor:pointer;font-size:.9rem;transition:.2s}
.btn:hover{background:#a0c8ff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-danger{background:#ff5f5f;color:#fff}
.btn-danger:hover{background:#ff8080}
.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.result-grid{grid-template-columns:1fr}}
canvas{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.reading-box{background:#0f1117;border-radius:8px;padding:20px;text-align:center}
.reading-value{font-size:3.5rem;font-weight:700;color:#7eb6ff;line-height:1}
.reading-label{font-size:.8rem;color:#666;margin-top:6px;text-transform:uppercase;letter-spacing:.08em}
.reading-meta{margin-top:16px;font-size:.83rem;color:#888;line-height:2}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:600}
.badge-ok{background:#1a3a1a;color:#4caf50}
.badge-oor{background:#3a1a1a;color:#ff5f5f}
.stream-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.stream-row input{flex:1;min-width:220px;padding:9px 14px;border-radius:6px;border:1px solid #2d3148;background:#0f1117;color:#e0e0e0;font-size:.9rem}
.stream-row input:focus{outline:none;border-color:#7eb6ff}
#streamImg{max-width:100%;border-radius:8px;display:block;background:#111;min-height:220px}
.status{font-size:.82rem;padding:4px 12px;border-radius:4px;background:#1a3a2a;color:#4caf50}
.status.err{background:#3a1a1a;color:#ff5f5f}
.kp-table{width:100%;border-collapse:collapse;font-size:.82rem}
.kp-table th{color:#666;font-weight:500;text-align:left;padding:5px 8px;border-bottom:1px solid #2d3148}
.kp-table td{padding:5px 8px;color:#ccc}
.kp-table tr:hover td{background:#1e2235}
.api-row{display:flex;gap:8px;align-items:center;margin-bottom:20px}
.api-row input{flex:1;padding:8px 12px;border-radius:6px;border:1px solid #2d3148;background:#0f1117;color:#e0e0e0;font-size:.85rem}
.api-row input:focus{outline:none;border-color:#7eb6ff}
.api-row label{font-size:.82rem;color:#666;white-space:nowrap}
</style>
</head>
<body>
<header>
  <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
    <circle cx="14" cy="14" r="12" stroke="#7eb6ff" stroke-width="2"/>
    <line x1="14" y1="14" x2="14" y2="5" stroke="#7eb6ff" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="14" cy="14" r="2.5" fill="#7eb6ff"/>
  </svg>
  <h1>meter-vision</h1>
  <span>Pointer Gauge Reader</span>
</header>

<div class="container">
  <div class="api-row">
    <label>API Server:</label>
    <input type="text" id="apiBase" value="" placeholder="http://127.0.0.1:9090">
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('image',this)">&#128247; Image</button>
    <button class="tab" onclick="switchTab('stream',this)">&#127909; Video Stream</button>
  </div>

  <!-- IMAGE PANEL -->
  <div id="panel-image" class="panel active">
    <div class="card">
      <h2>Upload Image</h2>
      <div class="upload-area" id="dropzone">
        <input type="file" id="fileInput" accept="image/*">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" style="margin:0 auto;display:block">
          <rect width="40" height="40" rx="8" fill="#1e2235"/>
          <path d="M20 12v16M12 20l8-8 8 8" stroke="#7eb6ff" stroke-width="2.2"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <p>Drag &amp; drop or click to select an image</p>
      </div>
      <div style="margin-top:16px;display:flex;gap:10px;align-items:center">
        <button class="btn" id="detectBtn" onclick="runDetect()" disabled>Detect</button>
        <span id="imgStatus" style="font-size:.85rem;color:#888"></span>
      </div>
    </div>

    <div class="result-grid" id="resultGrid" style="display:none">
      <div class="card" style="margin:0">
        <h2>Annotated Image</h2>
        <canvas id="resultCanvas"></canvas>
      </div>
      <div class="card" style="margin:0">
        <h2>Reading</h2>
        <div class="reading-box">
          <div class="reading-value" id="readingValue">&#8212;</div>
          <div class="reading-label">Scale Value</div>
          <div class="reading-meta" id="readingMeta"></div>
        </div>
        <div style="margin-top:20px">
          <h2 style="margin-bottom:8px">Keypoints</h2>
          <table class="kp-table">
            <thead><tr><th>ID</th><th>X</th><th>Y</th><th>Conf</th></tr></thead>
            <tbody id="kpTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- STREAM PANEL -->
  <div id="panel-stream" class="panel">
    <div class="card">
      <h2>Video Stream</h2>
      <div class="stream-row">
        <input type="text" id="streamSrc" value="0"
               placeholder="Camera index (0,1,...) or rtsp://ip/stream">
        <button class="btn" id="startBtn" onclick="startStream()">Start</button>
        <button class="btn btn-danger" id="stopBtn" onclick="stopStream()" disabled>Stop</button>
        <span id="streamStatus"></span>
      </div>
      <img id="streamImg" alt="Stream output will appear here">
    </div>
  </div>
</div>

<script>
// ---- API base (auto-detect same host, port 9090) ----
const apiInput = document.getElementById('apiBase');
apiInput.value = `http://${location.hostname || '127.0.0.1'}:9090`;
const getAPI = () => apiInput.value.replace(/\/+$/, '');

// ---- Tab switching ----
function switchTab(name, btn) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-' + name).classList.add('active');
}

// ---- Image detection ----
let selectedFile = null;
const fileInput  = document.getElementById('fileInput');
const dropzone   = document.getElementById('dropzone');
const detectBtn  = document.getElementById('detectBtn');

fileInput.addEventListener('change', e => { if (e.target.files[0]) loadFile(e.target.files[0]); });
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
dropzone.addEventListener('drop', e => {
  e.preventDefault(); dropzone.classList.remove('drag');
  if (e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  selectedFile = file;
  detectBtn.disabled = false;
  document.getElementById('imgStatus').textContent = file.name;
}

async function runDetect() {
  if (!selectedFile) return;
  detectBtn.disabled = true;
  document.getElementById('imgStatus').textContent = 'Detecting...';

  const form = new FormData();
  form.append('file', selectedFile);

  let data;
  try {
    const resp = await fetch(`${getAPI()}/detect`, { method: 'POST', body: form });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    data = await resp.json();
  } catch (e) {
    document.getElementById('imgStatus').textContent = 'Error: ' + e.message;
    detectBtn.disabled = false;
    return;
  }

  detectBtn.disabled = false;
  document.getElementById('imgStatus').textContent = 'Done';
  document.getElementById('resultGrid').style.display = 'grid';

  // Draw on canvas
  const img = new Image();
  img.onload = () => {
    const canvas = document.getElementById('resultCanvas');
    canvas.width  = img.width;
    canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    drawOverlay(ctx, data);
  };
  img.src = URL.createObjectURL(selectedFile);

  // Reading panel
  const r = data.reading;
  if (r && !r.error) {
    document.getElementById('readingValue').textContent = r.value.toFixed(2);
    const oor = r.out_of_range;
    document.getElementById('readingMeta').innerHTML =
      `<span class="badge ${oor ? 'badge-oor' : 'badge-ok'}">${oor ? 'Out of range' : 'In range'}</span><br>
       Pointer angle: ${r.pointer_angle_deg}&deg;<br>
       Confidence: ${(r.confidence * 100).toFixed(1)}%<br>
       Pivot: (${r.pivot[0]}, ${r.pivot[1]})`;
  } else {
    document.getElementById('readingValue').textContent = r ? r.error : 'No gauge';
    document.getElementById('readingMeta').innerHTML = '';
  }

  // Keypoints table
  const tbody = document.getElementById('kpTableBody');
  tbody.innerHTML = '';
  if (data.people && data.people[0]) {
    data.people[0].keypoints.forEach(kp => {
      const tr = document.createElement('tr');
      const conf = (kp.conf * 100).toFixed(0);
      tr.innerHTML = `<td>${kp.kp_id}</td><td>${kp.x.toFixed(1)}</td>` +
                     `<td>${kp.y.toFixed(1)}</td><td>${conf}%</td>`;
      tbody.appendChild(tr);
    });
  }
}

// ---- Canvas overlay ----
function drawOverlay(ctx, data) {
  if (!data.people || !data.people.length) return;
  const kps = {};
  data.people[0].keypoints.forEach(k => { if (k.conf >= 0.5) kps[k.kp_id] = k; });

  // Skeleton (pointer arm)
  [[0,1],[1,2]].forEach(([a,b]) => {
    if (kps[a] && kps[b]) {
      ctx.beginPath(); ctx.moveTo(kps[a].x, kps[a].y); ctx.lineTo(kps[b].x, kps[b].y);
      ctx.strokeStyle = 'rgba(255,165,0,.9)'; ctx.lineWidth = 2.5; ctx.stroke();
    }
  });

  // Keypoints
  Object.values(kps).forEach(kp => {
    ctx.beginPath(); ctx.arc(kp.x, kp.y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = '#ff3333'; ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = 'bold 11px Arial';
    ctx.fillText(kp.kp_id, kp.x + 7, kp.y - 4);
  });

  const r = data.reading;
  if (!r || r.error) return;

  const [px, py]  = r.pivot;
  const scaleArr  = r.scale_points;
  const meanR     = scaleArr.reduce((s, [sx, sy]) => s + Math.hypot(sx-px, sy-py), 0) / scaleArr.length;

  // Scale rays
  scaleArr.forEach(([sx, sy]) => {
    ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(sx, sy);
    ctx.strokeStyle = 'rgba(0,220,100,.55)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.beginPath(); ctx.arc(sx, sy, 4, 0, 2*Math.PI);
    ctx.fillStyle = 'rgba(0,220,100,.9)'; ctx.fill();
  });

  // Pivot marker
  ctx.beginPath(); ctx.arc(px, py, 10, 0, 2*Math.PI);
  ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(px-14, py); ctx.lineTo(px+14, py);
  ctx.moveTo(px, py-14); ctx.lineTo(px, py+14);
  ctx.strokeStyle = '#0f0'; ctx.lineWidth = 2; ctx.stroke();

  // Pointer arrow
  const rad   = r.pointer_angle_deg * Math.PI / 180;
  const tx    = px + meanR * Math.cos(rad);
  const ty    = py + meanR * Math.sin(rad);
  const color = r.out_of_range ? '#ff3333' : '#ff8800';
  drawArrow(ctx, px, py, tx, ty, color);

  // Reading label
  const label = r.value.toFixed(2) + (r.out_of_range ? ' [OOR]' : '');
  ctx.font = 'bold 18px Arial';
  const tw = ctx.measureText(label).width;
  const lx = Math.max(tx - tw / 2, 4);
  const ly = ty > 40 ? ty - 18 : ty + 30;
  ctx.fillStyle = 'rgba(0,0,0,.75)'; ctx.fillRect(lx - 4, ly - 18, tw + 8, 26);
  ctx.fillStyle = '#fff'; ctx.fillText(label, lx, ly);
}

function drawArrow(ctx, x1, y1, x2, y2, color) {
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const hs  = 14;
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.strokeStyle = color; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(x2, y2);
  ctx.lineTo(x2 - hs * Math.cos(ang - 0.4), y2 - hs * Math.sin(ang - 0.4));
  ctx.lineTo(x2 - hs * Math.cos(ang + 0.4), y2 - hs * Math.sin(ang + 0.4));
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

// ---- Video Stream ----
function startStream() {
  const src = document.getElementById('streamSrc').value.trim() || '0';
  const img = document.getElementById('streamImg');
  img.src   = `${getAPI()}/video_feed?source=${encodeURIComponent(src)}&_t=${Date.now()}`;
  document.getElementById('startBtn').disabled  = true;
  document.getElementById('stopBtn').disabled   = false;
  document.getElementById('streamStatus').textContent = 'Streaming...';
  document.getElementById('streamStatus').className   = 'status';
  img.onerror = () => {
    document.getElementById('streamStatus').textContent = 'Stream error';
    document.getElementById('streamStatus').className   = 'status err';
    stopStream();
  };
}

async function stopStream() {
  document.getElementById('streamImg').src = '';
  document.getElementById('startBtn').disabled  = false;
  document.getElementById('stopBtn').disabled   = true;
  document.getElementById('streamStatus').textContent = 'Stopped';
  document.getElementById('streamStatus').className   = 'status';
  try { await fetch(`${getAPI()}/video_stop`); } catch(e) {}
}
</script>
</body>
</html>
