version: "3.9"
services:
  backend:
    build: ./backend
    ports:
      - "9090:9090"
    volumes:
      - ./models:/app/models:ro
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
